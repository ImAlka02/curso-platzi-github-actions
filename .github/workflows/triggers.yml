# Nombre del Workflow que aparecera en actions
name: Workflow triggers

# Controls when the workflow will run
on: 
  # triggers
  push: #se ejecutara cuando se haga push al repositorio
    branches:
      - 'main'
      - 'aprendiendo-**'
      
  pull_request: #Se ejecutara cuando se haga un PR al repositorio
    types: [opened, labeled] #Estados que activaran el trigger
    branches:
      - 'main'
      - 'aprendiendo-**'
      
  workflow_dispatch: #Sirve para que puedas ejecutar un workflow a mano desde la pestaña Actions


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5.0.1
        with:
          dotnet-version: '9.0.x'
      # Runs a single command using the runners shell
      - name: Run hola mundo
        run: dotnet run

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
